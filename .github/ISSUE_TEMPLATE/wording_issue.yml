name: Wording or policy issue
description: Something in the security policy is unclear, wrong or needs to change
title: "docs: "
labels: ["documentation"]
assignees:
  - zaccesss
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: A short sentence explaining what this issue covers.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why does this need changing? What problem does the current wording cause?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything extra - links, related repositories, edge cases to watch for.
    validations:
      required: false
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
